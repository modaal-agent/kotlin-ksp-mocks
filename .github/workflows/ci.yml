name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Job summary
        if: always()
        run: |
          {
            echo "### kotlin-ksp-mocks — build"
            echo ""
            echo "- unit tests: mocks-processor (emission rules, determinism)"
            echo "- end-to-end: receipt (tests over the build's own generated mocks)"
          } >> "$GITHUB_STEP_SUMMARY"
