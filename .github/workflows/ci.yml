name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Rules lane ───────────────────────────────────────────────────
  # AGENTS.md and CLAUDE.md are one file kept in two places, so that an agent
  # reading either gets the same rules. Markdown and `cmp` only — no JDK, no
  # Gradle, no dependency resolution — so it reports in seconds, before the
  # build job has finished provisioning its toolchain.
  rules:
    name: Rules files (AGENTS.md == CLAUDE.md)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: AGENTS.md and CLAUDE.md are byte-identical
        # Fix a failure with `cp AGENTS.md CLAUDE.md`.
        run: cmp AGENTS.md CLAUDE.md

  # ── Skill lane ───────────────────────────────────────────────────
  # The agent skill under skills/ and the two .claude-plugin/ manifests, held
  # to the processor they document: every generated member the skill names is
  # one MockRenderer.kt emits, every diagnostic it quotes is one
  # KspMocksProcessor.kt logs, and the wiring it teaches is what
  # receipt/build.gradle.kts builds. Markdown and JSON through grep, awk and
  # python3 — no JDK, no Gradle — so it reports beside `rules`, in seconds.
  skill:
    name: Agent skill (skills/ and .claude-plugin/)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: The skill matches the processor it documents
        # `scripts/check-skill.sh --self-test` reds each check against a seeded
        # violation; run it locally when editing a check.
        run: scripts/check-skill.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: printMockApi prints what the test compilation generated
        # The skill's init script, skills/kotlin-ksp-mocks/scripts/print-mock-api.init.gradle.kts,
        # run on :receipt and compared with receipt/build/generated/ksp/ from the step above.
        # `scripts/check-print-mock-api.sh --self-test` reds each check against a seeded
        # violation; run it locally when editing a check.
        run: scripts/check-print-mock-api.sh

      - name: Job summary
        if: always()
        run: |
          {
            echo "### kotlin-ksp-mocks — build"
            echo ""
            echo "- unit tests: mocks-processor (emission rules, determinism)"
            echo "- end-to-end: receipt (tests over the build's own generated mocks)"
            echo "- printMockApi: the skill's init script on receipt, against the same generated mocks"
          } >> "$GITHUB_STEP_SUMMARY"
